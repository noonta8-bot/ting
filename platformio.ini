; ============================================================
;  PGM-FI Smart Gauge  -  ESP32-2432S028R (CYD) + Honda K-Line
;  ESP32-D0WD-V3 rev3, 240 MHz, 4 MB flash (DIO 40 MHz), no PSRAM
;  Arduino-ESP32 2.0.17 / ESP-IDF 4.4.7  (ตรงกับหน้า System Information)
; ============================================================
[platformio]
default_envs = cyd

; ---------- ค่าที่ใช้ร่วมกัน ----------
[common]
platform  = espressif32@6.9.0
board     = esp32dev
framework = arduino
board_build.f_cpu        = 240000000L
board_build.f_flash      = 40000000L
board_build.flash_mode   = dio
board_upload.flash_size  = 4MB
board_build.partitions   = no_ota.csv
board_build.filesystem   = littlefs
upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    links2004/WebSockets@^2.4.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/refs/heads/master.zip
build_flags =
    -std=gnu++17
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DUSE_HSPI_PORT=1
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1

; ============================================================
;  env หลัก: จอ ST7789 (บอร์ด CYD รุ่น 2 พอร์ต USB - สีจะสด/คมชัด)
; ============================================================
[env:cyd]
extends = common
build_flags =
    ${common.build_flags}
    -DST7789_DRIVER=1
    ; (ปิดไว้: จอรุ่นนี้ถ้าเปิด INVERSION_ON สีจะกลับขั้ว พื้นดำกลายเป็นขาว)
    ; -DTFT_INVERSION_ON=1
    -DSPI_FREQUENCY=40000000
    ; จอรุ่นนี้สลับสีแดง<->น้ำเงิน (เห็นจากรูปจริง: ท้องฟ้าน้ำเงินกลายเป็นส้ม) จึงเปิดโหมด BGR:
    ; (ถ้าเปิดแล้วสีกลับไปสลับอีก ให้ใส่ ; หน้าบรรทัดนี้)
    -DTFT_RGB_ORDER=TFT_BGR

; ============================================================
;  env สำรอง: จอ ILI9341 (ถ้า env cyd แล้วภาพเพี้ยน/ขาวดำกลับกัน)
;  สั่ง build:  pio run -e cyd_ili -t upload
; ============================================================
[env:cyd_ili]
extends = common
build_flags =
    ${common.build_flags}
    -DILI9341_2_DRIVER=1
    -DSPI_FREQUENCY=55000000
    ; ถ้าสีขาว/ดำกลับกัน ให้เอา ; ออกจากบรรทัดนี้:
    ; -DTFT_INVERSION_ON=1
