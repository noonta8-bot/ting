name: Build Firmware
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  fw:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [cyd, cyd_ili]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
      - name: merge bin
        run: |
          B=.pio/build/${{ matrix.env }}
          BOOT=$(find ~/.platformio/packages/framework-arduino-espressif32 -name boot_app0.bin | head -1)
          pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32 merge_bin -o $B/merged.bin --flash_mode dio --flash_freq 40m --flash_size 4MB 0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT" 0x10000 $B/firmware.bin || echo "merge skipped"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/merged.bin
